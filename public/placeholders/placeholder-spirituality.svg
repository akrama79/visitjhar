<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <defs>
    <linearGradient id="grad-spirituality" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <pattern id="pat-spirituality" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M0 16 L16 0 L32 16 L16 32 Z" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>
  
  <!-- Background with tribal geo motif -->
  <rect width="100%" height="100%" fill="url(#grad-spirituality)"/>
  <rect width="100%" height="100%" fill="url(#pat-spirituality)"/>

  <!-- Top Decorative Pill -->
  <g transform="translate(40, 40)">
    <rect width="130" height="26" rx="13" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <text x="65" y="17" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">VISITJHAR</text>
  </g>

  <!-- Central Emblem -->
  <g transform="translate(120, -10)">
    <path d="M200 120 L230 190 L170 190 Z" fill="none" stroke="#fbbf24" stroke-width="4"/>
           <rect x="180" y="190" width="40" height="70" fill="none" stroke="#fbbf24" stroke-width="4"/>
           <path d="M160 260 L240 260 L240 320 L160 320 Z" fill="none" stroke="#f59e0b" stroke-width="4"/>
           <circle cx="200" cy="100" r="12" fill="#f59e0b"/>
           <path d="M190 290 L210 290 M200 280 L200 320" stroke="#fbbf24" stroke-width="3"/>
  </g>

  <!-- Footer Information -->
  <g transform="translate(40, 320)">
    <text x="0" y="24" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" letter-spacing="-0.5">Spiritual & Sacred Heritage</text>
    <text x="0" y="48" fill="rgba(255,255,255,0.75)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Ancient Shrines & Sacred Traditions of Jharkhand</text>
  </g>
</svg>