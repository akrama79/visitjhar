<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <defs>
    <linearGradient id="grad-wildlife" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e3a1e"/>
      <stop offset="100%" stop-color="#2e592e"/>
    </linearGradient>
    <pattern id="pat-wildlife" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M0 16 L16 0 L32 16 L16 32 Z" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>
  
  <!-- Background with tribal geo motif -->
  <rect width="100%" height="100%" fill="url(#grad-wildlife)"/>
  <rect width="100%" height="100%" fill="url(#pat-wildlife)"/>

  <!-- Top Decorative Pill -->
  <g transform="translate(40, 40)">
    <rect width="130" height="26" rx="13" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <text x="65" y="17" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">VISITJHAR</text>
  </g>

  <!-- Central Emblem -->
  <g transform="translate(120, -10)">
    <circle cx="200" cy="200" r="60" fill="none" stroke="#a3e635" stroke-width="4"/>
           <path d="M170 180 Q180 160 200 175 Q220 160 230 180" fill="none" stroke="#84cc16" stroke-width="4"/>
           <circle cx="180" cy="195" r="5" fill="#a3e635"/>
           <circle cx="220" cy="195" r="5" fill="#a3e635"/>
           <path d="M190 220 Q200 235 210 220" fill="none" stroke="#84cc16" stroke-width="4"/>
  </g>

  <!-- Footer Information -->
  <g transform="translate(40, 320)">
    <text x="0" y="24" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" letter-spacing="-0.5">Wildlife & Protected Habitats</text>
    <text x="0" y="48" fill="rgba(255,255,255,0.75)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Sanctuaries of Chotanagpur & Palamau</text>
  </g>
</svg>