<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <defs>
    <linearGradient id="grad-default" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#134e4a"/>
      <stop offset="100%" stop-color="#042f2e"/>
    </linearGradient>
    <pattern id="pat-default" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M0 16 L16 0 L32 16 L16 32 Z" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>
  
  <!-- Background with tribal geo motif -->
  <rect width="100%" height="100%" fill="url(#grad-default)"/>
  <rect width="100%" height="100%" fill="url(#pat-default)"/>

  <!-- Top Decorative Pill -->
  <g transform="translate(40, 40)">
    <rect width="130" height="26" rx="13" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <text x="65" y="17" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">VISITJHAR</text>
  </g>

  <!-- Central Emblem -->
  <g transform="translate(120, -10)">
    <rect x="130" y="160" width="140" height="100" rx="12" fill="none" stroke="#2dd4bf" stroke-width="4"/>
           <circle cx="165" cy="195" r="14" fill="#2dd4bf"/>
           <path d="M140 245 L180 205 L210 230 L235 210 L260 245 Z" fill="#0f766e" opacity="0.6"/>
  </g>

  <!-- Footer Information -->
  <g transform="translate(40, 320)">
    <text x="0" y="24" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" letter-spacing="-0.5">Authentic Jharkhand Tourism</text>
    <text x="0" y="48" fill="rgba(255,255,255,0.75)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Official VisitJhar Field Photograph Pending</text>
  </g>
</svg>