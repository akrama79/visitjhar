<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <defs>
    <linearGradient id="grad-nature" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#052e16"/>
      <stop offset="50%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
    <pattern id="pat-nature" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M0 16 L16 0 L32 16 L16 32 Z" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>
  
  <!-- Background with tribal geo motif -->
  <rect width="100%" height="100%" fill="url(#grad-nature)"/>
  <rect width="100%" height="100%" fill="url(#pat-nature)"/>

  <!-- Top Decorative Pill -->
  <g transform="translate(40, 40)">
    <rect width="130" height="26" rx="13" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <text x="65" y="17" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">VISITJHAR</text>
  </g>

  <!-- Central Emblem -->
  <g transform="translate(120, -10)">
    <path d="M200 130 L250 220 L220 220 L260 280 L140 280 L180 220 L150 220 Z" fill="none" stroke="#4ade80" stroke-width="4"/>
           <rect x="190" y="280" width="20" height="40" fill="#15803d"/>
           <path d="M130 290 C160 270, 240 270, 270 290" fill="none" stroke="#22c55e" stroke-width="3"/>
  </g>

  <!-- Footer Information -->
  <g transform="translate(40, 320)">
    <text x="0" y="24" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" letter-spacing="-0.5">Scenic Landscapes & Forests</text>
    <text x="0" y="48" fill="rgba(255,255,255,0.75)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Sal Canopy & Untouched Plateau Wilderness</text>
  </g>
</svg>