<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <defs>
    <linearGradient id="grad-heritage" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="50%" stop-color="#431407"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>
    <pattern id="pat-heritage" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M0 16 L16 0 L32 16 L16 32 Z" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>
  
  <!-- Background with tribal geo motif -->
  <rect width="100%" height="100%" fill="url(#grad-heritage)"/>
  <rect width="100%" height="100%" fill="url(#pat-heritage)"/>

  <!-- Top Decorative Pill -->
  <g transform="translate(40, 40)">
    <rect width="130" height="26" rx="13" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <text x="65" y="17" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">VISITJHAR</text>
  </g>

  <!-- Central Emblem -->
  <g transform="translate(120, -10)">
    <path d="M140 320 L140 200 L170 200 L170 170 L200 140 L230 170 L230 200 L260 200 L260 320 Z" fill="none" stroke="#fb923c" stroke-width="4"/>
           <path d="M180 320 C180 280, 220 280, 220 320 Z" fill="none" stroke="#ea580c" stroke-width="4"/>
           <rect x="190" y="210" width="20" height="30" rx="10" fill="none" stroke="#fdba74" stroke-width="3"/>
  </g>

  <!-- Footer Information -->
  <g transform="translate(40, 320)">
    <text x="0" y="24" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" letter-spacing="-0.5">Heritage & Archaeology</text>
    <text x="0" y="48" fill="rgba(255,255,255,0.75)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Historic Forts, Palaces & Monuments</text>
  </g>
</svg>